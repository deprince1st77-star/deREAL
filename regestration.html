<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration, Course & Book</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(120deg, #6a11cb, #2575fc);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: #fff;
  padding: 30px;
  width: 380px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.input-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

textarea {
  height: 80px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #2575fc;
  color: #fff;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  background: #1a5edb;
}

.hidden {
  display: none;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
</style>
</head>
<body>

<div class="container">

<!-- REGISTRATION -->
<div id="register">
  <h2>Create Account</h2>
  <form onsubmit="return registerUser()">
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="name">
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password">
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword">
    </div>

    <div class="input-group">
      <label>Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <button type="submit">Register</button>
  </form>
</div>

<!-- COURSE & BOOK -->
<div id="main" class="hidden">

  <div class="tabs">
    <button onclick="showSection('course')">Course</button>
    <button onclick="showSection('book')">Book</button>
  </div>

  <!-- COURSE FORM -->
  <form id="course">
    <h2>Course Form</h2>

    <div class="input-group">
      <label>Course Title</label>
      <input type="text">
    </div>

    <div class="input-group">
      <label>Target Audience</label>
      <input type="text">
    </div>

    <div class="input-group">
      <label>Modules</label>
      <textarea></textarea>
    </div>

    <button type="submit">Save Course</button>
  </form>

  <!-- BOOK FORM -->
  <form id="book" class="hidden">
    <h2>Book Form</h2>

    <div class="input-group">
      <label>Book Title</label>
      <input type="text">
    </div>

    <div class="input-group">
      <label>Genre</label>
      <input type="text">
    </div>

    <div class="input-group">
      <label>Chapters</label>
      <textarea></textarea>
    </div>

    <button type="submit">Save Book</button>
  </form>

</div>
</div>

<script>
function registerUser() {
  let name = nameInput = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let confirm = document.getElementById("confirmPassword").value;
  let gender = document.getElementById("gender").value;

  if (!name || !email || !password || !confirm || !gender) {
    alert("All fields are required!");
    return false;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters!");
    return false;
  }

  if (password !== confirm) {
    alert("Passwords do not match!");
    return false;
  }

  alert("Registration Successful 🎉");

  document.getElementById("register").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");

  return false;
}

function showSection(type) {
  document.getElementById("course").classList.add("hidden");
  document.getElementById("book").classList.add("hidden");

  document.getElementById(type).classList.remove("hidden");
}
</script>

</body>
</html>
